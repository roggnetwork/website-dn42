{{ define "main" }}
<div class="container">
  <article class="doc">
    <nav class="breadcrumb">
      <a href="{{ "/" | relURL }}">Home</a> &gt; {{ .Title }}
    </nav>

    {{ if .Pages }}
    <ul class="doc-list">
      {{ range .Pages.ByWeight }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
      {{ end }}
    </ul>
    {{ end }}
  </article>
</div>
{{ end }}
