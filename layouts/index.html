{{ define "main" }}
<div class="container">
  <article class="doc">
    <div class="doc-content">
      {{ .Content }}
    </div>
    <h2 class="pop-heading">POPs</h2>
    <div id="pop-map" class="pop-map" aria-label="Map of rogg POPs: SEA1 (Seattle) and CMH1 (Columbus)"></div>
  </article>
</div>

<link rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="" />
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script>
  (function () {
    var pops = [
      { name: 'SEA1', coords: [47.6062, -122.3321], url: '/dashboards/sea1/' },
      { name: 'CMH1', coords: [39.9612, -82.9988], url: '/dashboards/cmh1/' }
    ];
    var map = L.map('pop-map', {
      scrollWheelZoom: true,
      minZoom: 2,
      maxBounds: [[-85, -180], [85, 180]],
      maxBoundsViscosity: 1.0
    });
    map.attributionControl.setPrefix(false);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      noWrap: true,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);
    var markers = pops.map(function (p) {
      function go() { window.location.href = p.url; }
      var m = L.circleMarker(p.coords, {
        radius: 7,
        color: '#ffffff',
        weight: 3,
        fillColor: '#2a2a2a',
        fillOpacity: 1
      }).addTo(map);
      m.bindTooltip(p.name, { permanent: true, direction: 'top', className: 'pop-label', interactive: true });
      m.on('click', go);
      m.on('tooltipopen', function (e) {
        var el = e.tooltip.getElement();
        el.style.cursor = 'pointer';
        el.addEventListener('click', go);
      });
      return m;
    });
    var ibgp = L.polyline(pops.map(function (p) { return p.coords; }), {
      color: '#2a2a2a',
      weight: 1.5
    }).addTo(map).bindTooltip('iBGP');
    map.setView([25, -30], 2);
  })();
</script>
{{ end }}
